name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gaincheck-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package and build frontend
        run: |
          python -m pip install --upgrade pip build
          python -m pip install --no-deps -e .
      - name: Compile package
        run: python -m compileall -q gaincheck
      - name: Run unittest suite
        run: python -m unittest discover -s tests -p "test*.py"
      - name: Run human demo
        run: python -m gaincheck demo
      - name: Validate JSON demo
        run: >-
          python -c "import json, subprocess, sys; p=subprocess.run([sys.executable, '-m', 'gaincheck', 'demo', '--json'], check=True, capture_output=True, text=True); d=json.loads(p.stdout); assert d['schema_version'] == 1"
      - name: Build and fresh-install wheel
        run: |
          python -m build --wheel --sdist --outdir dist/ci
          python scripts/ci_smoke.py --wheel-dir dist/ci

  release-artifacts:
    name: build release artifacts
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Install build frontend
        run: python -m pip install --upgrade pip build
      - name: Build wheel, source distribution, zipapp, and receipts
        run: python scripts/build_release.py
      - name: Smoke-test zipapp demo
        run: python dist/release/gaincheck-0.1.0.pyz demo
      - name: Upload build-only artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gaincheck-release-artifacts
          path: dist/release/
          if-no-files-found: error
          retention-days: 14

