[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaincheck"
version = "0.1.0"
description = "Portable evidence receipts for supplied agent output captures"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
gaincheck = "gaincheck.cli:main"

[tool.setuptools.packages.find]
include = ["gaincheck*"]
