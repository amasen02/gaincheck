[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gaincheck"
version = "0.1.0"
description = "Portable evidence receipts for supplied agent output captures"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
gaincheck = "gaincheck.cli:main"

[tool.setuptools.packages.find]
include = ["gaincheck*"]
